<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">flipback</title>
  <desc id="d">Your agent stopped. It could have kept going.</desc>

  <rect width="1280" height="640" fill="#0d1117"/>

  <!-- the mark, scaled from assets/logo.svg -->
  <g transform="translate(96 168) scale(0.86)">
    <g stroke="#F59E0B" stroke-width="14" stroke-linecap="round">
      <path d="M128 6 V26"/>
      <path d="M76 18 L86 36"/>
      <path d="M180 18 L170 36"/>
    </g>
    <rect x="40" y="46" width="176" height="194" rx="34" fill="none" stroke="#64748B" stroke-width="16"/>
    <rect x="68" y="72" width="120" height="58" rx="18" fill="#F59E0B"/>
    <g stroke="#64748B" stroke-width="16" stroke-linecap="round">
      <path d="M100 164 V112"/>
      <path d="M156 164 V112"/>
    </g>
    <rect x="80" y="158" width="96" height="62" rx="22" fill="#64748B"/>
    <circle cx="106" cy="190" r="11" fill="#FCD34D"/>
    <circle cx="150" cy="190" r="11" fill="#FCD34D"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif">
    <text x="384" y="238" font-size="88" font-weight="700" fill="#e6edf3" letter-spacing="-2">flipback</text>
    <text x="384" y="312" font-size="40" fill="#F59E0B">Your agent stopped.</text>
    <text x="384" y="366" font-size="40" fill="#8b949e">It could have kept going.</text>

    <!-- the one line that explains the whole thing -->
    <text x="384" y="452" font-size="26" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Ask for five things. Get three, and a summary</text>
    <text x="384" y="490" font-size="26" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">that describes five.</text>

    <text x="384" y="566" font-size="24" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/plugin install flipback</text>
  </g>
</svg>
